<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Flick" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Flick</title>
    <style>
      /* Painted before any JS/CSS bundle arrives: full-screen skeleton. */
      html,body{margin:0;background:#f6f7fb}
      .boot{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0}
      .boot b{display:block;background:rgba(11,13,18,.06);position:relative;overflow:hidden}
      .boot b::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:bs 1.4s ease-in-out infinite}
      @keyframes bs{to{transform:translateX(100%)}}
      .boot .a{width:40px;height:40px;border-radius:99px;margin-left:auto}
      .boot .c{height:60px;border-radius:26px;margin-top:12px}
      .boot .s{height:48px;border-radius:99px;margin-top:18px}
      .boot .r{height:60px;border-radius:22px;margin-top:10px}
      .boot .r:first-of-type{margin-top:14px}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true"><b class="a"></b><b class="c"></b><b class="s"></b><b class="r"></b><b class="r"></b><b class="r"></b><b class="r"></b><b class="r"></b></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
